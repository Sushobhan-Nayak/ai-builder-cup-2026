name: Deploy GembaOS to Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: deep-atlas-511314-r4
  REGION: asia-southeast1
  SERVICE_NAME: gembaos-gateway

jobs:
  deploy-gateway:
    name: Deploy Gateway (Backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Gateway to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --set-env-vars "PROJECT_ID=${{ env.PROJECT_ID }},ENVIRONMENT=production,GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5

  deploy-ui:
    name: Deploy UI (gembaos-ui)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy gembaos-ui to Cloud Run
        run: |
          gcloud run deploy gembaos-ui \
            --source gembaos-ui \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "NEXT_PUBLIC_API_URL=https://gembaos-gateway-100149412472.asia-southeast1.run.app" \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3


