[project]
name = "gembaos-backend"
version = "0.1.0"
description = "GembaOS backend services and agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "google-genai>=0.1.0",
    "google-cloud-bigquery>=3.17.0",
    "google-cloud-firestore>=2.14.0",
    "google-cloud-pubsub>=2.19.0",
    "sqlglot>=23.0.0",
    "simpy>=4.1.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "websockets>=12.0",
    "google-adk>=2.12.0",
    "ortools>=9.9.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

